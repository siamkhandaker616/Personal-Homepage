<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100" height="80">
  <defs>
    <!-- Drop Shadow for the Quirky Comic Look -->
    <filter id="quirky-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="12" stdDeviation="2" flood-color="#4a3b5c" flood-opacity="0.2"/>
    </filter>

    <!-- Rich Pastel Gradients -->
    <linearGradient id="check-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E08951"/>
      <stop offset="40%" stop-color="#E18C54"/>
      <stop offset="100%" stop-color="#EBC597"/>
    </linearGradient>

    <linearGradient id="flower-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1925C"/>
      <stop offset="100%" stop-color="#EBC597"/>
    </linearGradient>

    <linearGradient id="flower-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6D3B"/>
      <stop offset="100%" stop-color="#E7B988"/>
    </linearGradient>
  </defs>

  <!-- 1. 3D/Offset Shadow Layer of the Checkmark -->
  <path d="M 110,310 
           C 140,280 185,320 225,370 
           C 235,385 245,385 255,370
           C 340,250 430,130 510,70
           C 540,50 565,80 535,120
           C 440,230 320,410 270,480
           C 240,520 200,520 170,480
           C 135,430 95,360 85,340
           C 75,320 90,325 110,310 Z" 
        fill="#CC5D27" 
        transform="translate(5, 8)"/>

  <!-- 2. Main Checkmark Body -->
  <path d="M 110,310 
           C 140,280 185,320 225,370 
           C 235,385 245,385 255,370
           C 340,250 430,130 510,70
           C 540,50 565,80 535,120
           C 440,230 320,410 270,480
           C 240,520 200,520 170,480
           C 135,430 95,360 85,340
           C 75,320 90,325 110,310 Z" 
        fill="url(#check-grad)" 
        stroke="#4a3b5c" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#quirky-shadow)"/>

  <!-- 3. Glossy/High-Contrast Inner Highlight Curve -->
  <path d="M 125,325 C 150,305 180,340 220,390 C 240,415 250,400 270,370 C 350,250 440,140 515,95" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        opacity="0.5"/>

  <!-- 4. Dense Floral Overlays & Doodles Blooming From the Checkmark -->
  <g id="flowers" filter="url(#quirky-shadow)">
    
    <!-- Big Flower Cluster at the Long Tip (Top Right) -->
    <g transform="translate(515, 95)">
      <!-- Leaves -->
      <path d="M 0,0 C 20,-30 50,-20 40,10 C 20,20 10,10 0,0 Z" fill="#81c784" stroke="#4a3b5c" stroke-width="4"/>
      <path d="M -20,-20 C -40,-50 -10,-60 10,-30 C 10,-10 -10,-10 -20,-20 Z" fill="#a5d6a7" stroke="#4a3b5c" stroke-width="4"/>
      <!-- Main Blossom -->
      <path d="M 5,5 C 25,25 55,5 40,-15 C 55,-35 25,-45 10,-25 C -5,-45 -35,-35 -20,-15 C -35,5 -5,25 5,5 Z" fill="url(#flower-pink)" stroke="#4a3b5c" stroke-width="5"/>
      <circle cx="10" cy="-10" r="10" fill="#fff59d" stroke="#4a3b5c" stroke-width="4"/>
    </g>

    <!-- Flower Cluster at the Short Tip (Left) -->
    <g transform="translate(100, 320) scale(0.85)">
      <path d="M 0,0 C -20,-20 -40,0 -20,20 C 0,40 20,20 0,0 Z" fill="#E08951" stroke="#4a3b5c" stroke-width="4"/>
      <!-- Petals -->
      <circle cx="-15" cy="0" r="12" fill="url(#flower-purple)" stroke="#4a3b5c" stroke-width="4"/>
      <circle cx="15" cy="0" r="12" fill="url(#flower-purple)" stroke="#4a3b5c" stroke-width="4"/>
      <circle cx="0" cy="-15" r="12" fill="url(#flower-purple)" stroke="#4a3b5c" stroke-width="4"/>
      <circle cx="0" cy="15" r="12" fill="url(#flower-purple)" stroke="#4a3b5c" stroke-width="4"/>
      <circle cx="0" cy="0" r="10" fill="#ffe082" stroke="#4a3b5c" stroke-width="4"/>
    </g>

    <!-- Center Base Flower (Cropping out of the crook of the check) -->
    <g transform="translate(210, 420) scale(0.7)">
      <path d="M-20,-20 C-40,-40 -60,-10 -40,10 C-60,30 -30,50 0,30 C30,50 50,20 30,-10 C40,-30 10,-40 -20,-20 Z" fill="url(#flower-pink)" stroke="#4a3b5c" stroke-width="4.5"/>
      <circle cx="-5" cy="2" r="9" fill="#fff59d" stroke="#4a3b5c" stroke-width="4"/>
    </g>

    <!-- Small Accent Doodles, Swirls & Sparkles -->
    <!-- Swirl Left -->
    <path d="M 70,370 Q 50,390 60,410 T 90,400" fill="none" stroke="#4a3b5c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="400" r="4" fill="#E1925B"/>
    
    <!-- Sparkle Top Left -->
    <path d="M 280,180 L 285,195 L 300,200 L 285,205 L 280,220 L 275,205 L 260,200 L 275,195 Z" fill="#fff59d" stroke="#4a3b5c" stroke-width="2"/>
    
    <!-- Sparkle Bottom Right -->
    <path d="M 380,420 L 383,430 L 393,433 L 383,436 L 380,446 L 377,436 L 367,433 L 377,430 Z" fill="#fff59d" stroke="#4a3b5c" stroke-width="2"/>
    
    <!-- Small Dots -->
    <circle cx="310" cy="240" r="5" fill="#E1925B"/>
    <circle cx="440" cy="180" r="6" fill="#E08951"/>
    <circle cx="160" cy="470" r="4" fill="#fff59d"/>
  </g>
</svg>
