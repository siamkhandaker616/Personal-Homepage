<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100" height="80">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1C7EB" />
      <stop offset="100%" stop-color="#DABEE5" />
    </radialGradient>

    <!-- Case Gradient (Pastel Pink) -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8BDE4" />
      <stop offset="0%" stop-color="#C9A9D9" />
      <stop offset="100%" stop-color="#C9A9D9" />
      <stop offset="100%" stop-color="#CCADDB" />
    </linearGradient>

    <!-- Rim Highlights -->
    <linearGradient id="rimGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A9D9" />
      <stop offset="100%" stop-color="#E0C6EA" />
    </linearGradient>

    <!-- Dial Gradient (Soft Creamy White) -->
    <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#D9BEE5" />
      <stop offset="100%" stop-color="#fff4fa" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#9c7892"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== WATCH HARDWARE ==================== -->
  <g filter="url(#softShadow)">
    <!-- Top Crown / Winder Button -->
    <path d="M 230 45 L 270 45 L 265 75 L 235 75 Z" fill="#C9A3D5" stroke="#d1c4e9" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="250" cy="42" r="12" fill="#CC96CD" opacity="0.15" /> <!-- Soft accent warmth -->
    <rect x="234" y="45" width="32" height="6" rx="2" fill="#C468AE" />
    
    <!-- Top Loop/Ring -->
    <circle cx="250" cy="65" r="32" fill="none" stroke="url(#rimGrad)" stroke-width="7" />

    <!-- Side Clickers (Left and Right) -->
    <path d="M 140 105 L 120 120 L 132 135 L 153 118 Z" fill="#C8A6D7" stroke="#e8c5e5" stroke-width="2" stroke-linejoin="round" />
    <path d="M 360 105 L 380 120 L 368 135 L 347 118 Z" fill="#C8A6D7" stroke="#e8c5e5" stroke-width="2" stroke-linejoin="round" />

    <!-- Main Outer Case -->
    <circle cx="250" cy="265" r="150" fill="url(#caseGrad)" stroke="#f3e5f5" stroke-width="4" />
    <!-- Decorative Scalloped Outer Rim Base -->
    <circle cx="250" cy="265" r="142" fill="none" stroke="url(#rimGrad)" stroke-width="6" />
    
    <!-- Inner Dial Face -->
    <circle cx="250" cy="265" r="122" fill="url(#dialGrad)" stroke="#fcd5e8" stroke-width="2" />
  </g>

  <!-- ==================== WHIMSICAL BOTANICALS & WHORLS ==================== -->
  <!-- Background Flourishes inside the dial -->
  <g opacity="0.75">
    <!-- Soft Lilac vines looping in background -->
    <path d="M 170 240 C 160 300, 220 360, 260 350 C 300 340, 330 290, 310 240" fill="none" stroke="#f1d2e7" stroke-width="2.5" stroke-dasharray="1 4" stroke-linecap="round"/>
    <path d="M 210 200 C 220 160, 280 160, 290 200" fill="none" stroke="#f1d2e7" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Center Flourishing Vine/Whorl Structure -->
    <path d="M 250 387 C 230 387, 205 370, 210 345 C 215 320, 245 320, 250 340 C 253 355, 240 365, 232 358 C 228 352, 232 342, 240 342" 
          fill="none" stroke="#ce93d8" stroke-width="3" stroke-linecap="round" />
    <path d="M 250 387 C 270 387, 295 370, 290 345 C 285 320, 255 320, 250 340 C 247 355, 260 365, 268 358 C 272 352, 268 342, 260 342" 
          fill="none" stroke="#ce93d8" stroke-width="3" stroke-linecap="round" />

    <!-- Left Side Vines -->
    <path d="M 135 240 C 130 200, 160 170, 185 180 C 200 185, 200 205, 185 210 C 175 212, 170 200, 178 195" 
          fill="none" stroke="#f48fb1" stroke-width="2.5" stroke-linecap="round" />
          
    <!-- Right Side Vines -->
    <path d="M 365 240 C 370 200, 340 170, 315 180 C 300 185, 300 205, 315 210 C 325 212, 330 200, 322 195" 
          fill="none" stroke="#f48fb1" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ==================== DIAL TICK MARKS & NUMBERS ==================== -->
  <!-- Whimsical dots for numbers -->
  <g fill="#C468AE">
    <circle cx="250" cy="162" r="4.5" /> <!-- 12 o'clock -->
    <circle cx="353" cy="265" r="4.5" /> <!-- 3 o'clock -->
    <circle cx="250" cy="368" r="4.5" /> <!-- 6 o'clock -->
    <circle cx="147" cy="265" r="4.5" /> <!-- 9 o'clock -->
    
    <!-- Minor ticks represented as delicate tiny dots -->
    <circle cx="301" cy="179" r="2.5" />
    <circle cx="336" cy="214" r="2.5" />
    <circle cx="336" cy="316" r="2.5" />
    <circle cx="301" cy="351" r="2.5" />
    <circle cx="199" cy="351" r="2.5" />
    <circle cx="164" cy="316" r="2.5" />
    <circle cx="164" cy="214" r="2.5" />
    <circle cx="199" cy="179" r="2.5" />
  </g>

  <!-- Decorative Tiny Stars / Sparkles on Dial -->
  <g fill="#CB97CE" filter="url(#glow)">
    <!-- 4-point star top right -->
    <path d="M 310 195 Q 310 200 315 200 Q 310 200 310 205 Q 310 200 305 200 Q 310 200 310 195 Z" />
    <!-- 4-point star left -->
    <path d="M 180 290 Q 180 293 183 293 Q 180 293 180 296 Q 180 293 177 293 Q 180 293 180 290 Z" />
  </g>

  <!-- ==================== FLOWERS ==================== -->
  <!-- Top Center Blossom (Lilac/Pink) -->
  <g transform="translate(250, 153)">
    <g fill="#C8A6D7">
      <circle cx="0" cy="-8" r="8" /> <circle cx="7" cy="-3" r="8" />
      <circle cx="5" cy="6" r="8" /> <circle cx="-5" cy="6" r="8" />
      <circle cx="-7" cy="-3" r="8" />
    </g>
    <circle cx="0" cy="0" r="5" fill="#C9A3D5" />
    <circle cx="0" cy="0" r="2" fill="#fff" />
  </g>

  <!-- Bottom Left Blossom (Soft Purple) -->
  <g transform="translate(175, 335)">
    <g fill="#C9A3D5">
      <circle cx="0" cy="-7" r="7" /> <circle cx="6" cy="-2" r="7" />
      <circle cx="4" cy="5" r="7" /> <circle cx="-4" cy="5" r="7" />
      <circle cx="-6" cy="-2" r="7" />
    </g>
    <circle cx="0" cy="0" r="4" fill="#C8A6D7" />
    <circle cx="0" cy="0" r="1.5" fill="#fff" />
  </g>

  <!-- Bottom Right Blossom (Pastel Pink) -->
  <g transform="translate(320, 330)">
    <g fill="#CCADDB">
      <circle cx="0" cy="-7" r="7" /> <circle cx="6" cy="-2" r="7" />
      <circle cx="4" cy="5" r="7" /> <circle cx="-4" cy="5" r="7" />
      <circle cx="-6" cy="-2" r="7" />
    </g>
    <circle cx="0" cy="0" r="4" fill="#C9A3D5" />
    <circle cx="0" cy="0" r="1.5" fill="#fff" />
  </g>

  <!-- Tiny Accent Buds -->
  <circle cx="145" cy="190" r="4" fill="#CF87C4" />
  <circle cx="350" cy="190" r="4" fill="#CF83C2" />
  
  <circle cx="218" cy="335" r="3" fill="#C9A3D5" />
  <circle cx="282" cy="335" r="3" fill="#C8A6D7" />

  <!-- ==================== HANDS & CENTER PIN ==================== -->
  <!-- Elegant, Ornate Central Hands -->
  
  <!-- Hour/Minute Hand (Whimsical Leaf/Loop Style pointing towards 2 o'clockish) -->
  <g transform="rotate(55, 250, 265)">
    <path d="M 250 265 C 245 230, 235 210, 250 185 C 265 210, 255 230, 250 265 Z" fill="#C468AE"/>
    <circle cx="250" cy="205" r="3" fill="#fff" />
  </g>

  <!-- Chrono Second Hand (Long, slender, curly tail, pointing past 10 o'clock) -->
  <g transform="rotate(-40, 250, 265)">
    <!-- Shaded Line -->
    <path d="M 250 290 Q 250 265 250 150 Q 250 140 242 142 Q 237 145 242 152 Q 248 155 250 148" 
          fill="none" stroke="#FF25B8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Heart or leaf detail near tip -->
    <path d="M 250 165 Q 244 157 250 152 Q 256 157 250 165 Z" fill="#CF87C4" />
  </g>

  <!-- Center Pin / Escutcheon -->
  <circle cx="250" cy="265" r="10" fill="#D4B7E1" stroke="#ba68c8" stroke-width="2" />
  <circle cx="250" cy="265" r="5" fill="#ffffff" />
  <circle cx="250" cy="265" r="2" fill="#B058A2" />

</svg>
